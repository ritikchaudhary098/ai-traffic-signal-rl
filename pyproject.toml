[project]
name = "ai-traffic-signal-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pygame>=2.6.1",
    "stable-baselines3>=2.9.0",
    "streamlit>=1.64.0",
    "torch>=2.14.1",
]

[project.scripts]
ai-traffic-signal-rl = "ai_traffic_signal_rl:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
